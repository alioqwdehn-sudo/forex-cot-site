name: Validate publication safeguards

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "Parsed #{path}" }' .github/workflows/*.yml
      - name: Compile public Python scripts
        run: python3 -m py_compile scripts/verify_static_site.py scripts/download_approved_artifact.py tests/test_publication.py
      - name: Run synthetic security tests without credentials
        run: python3 -m unittest discover -s tests -v
